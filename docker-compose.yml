services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/restaurants
      - MONGO_URL=mongodb://mongodb:27017
    depends_on:
      - postgres
      - mongodb

  app:
    build: .
    command: streamlit run app/main.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - API_BASE=http://api:8000/api
      - DATABASE_URL=postgresql://user:password@postgres:5432/restaurants
      - MONGO_URL=mongodb://mongodb:27017
    depends_on:
      - api
      - postgres
      - mongodb

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: restaurants
    ports:
      - "5432:5432"

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"

  mcp:
    build: .
    command: tail -f /dev/null
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - mongodb